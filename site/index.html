<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фитнес-клуб «ПУЛЬС» — единая система</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="ui2.css">
<style>
  body{padding:0}
  .daytabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .dt{width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0;border-radius:14px;background:var(--card);border:1px solid var(--border);cursor:pointer}
  .dt .dd{font-size:20px;font-weight:600}
  .dt .mm{font-size:12px;color:var(--text3)}
  .dt.on{background:var(--lime);border-color:var(--lime)}
  .dt.on .dd,.dt.on .mm{color:var(--ondark)}
  .prog{display:flex;flex-direction:column;gap:6px}
  .ph2{height:150px;border-radius:14px;display:flex;align-items:flex-end;padding:14px;position:relative;overflow:hidden}
  .ph2 .em{position:absolute;right:10px;top:6px;font-size:56px;opacity:.35}
  .ph2 .nm{font-size:16px;font-weight:600;color:#fff}
  .g-Yoga{background:linear-gradient(135deg,#2E3B25,#5A7142)} .g-HIIT{background:linear-gradient(135deg,#3E4A12,#8FA52A)}
  .g-Pilates{background:linear-gradient(135deg,#22303A,#3E5A6B)} .g-Cycling{background:linear-gradient(135deg,#2A1A22,#6B3550)}
  .g-Stretch{background:linear-gradient(135deg,#2A2A3A,#55557A)} .g-Str{background:linear-gradient(135deg,#3A2A14,#8A6430)}
  .heroMini{padding:0 40px;margin-top:36px;display:flex;align-items:center;gap:14px}
  .dlgWrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
  .krow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
  .krow:last-child{border-bottom:none}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--text2);font-size:14px;cursor:pointer;margin-bottom:18px}
  .back:hover{color:var(--lime)}
  .mk{display:flex;align-items:center;gap:10px}
  .mk .mbtn{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border2);background:var(--card);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer}
  .mk .mbtn.on-p{background:var(--lime);border-color:var(--lime);color:var(--ondark)}
  .mk .mbtn.on-a{background:#3A1410;border-color:var(--danger);color:var(--danger)}
  .demo-hint{background:rgba(200,245,58,.07);border:1px dashed rgba(200,245,58,.35);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.7}
  .toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:99}
  .toast{padding:14px 18px;border-radius:12px;background:var(--elev);border:1px solid var(--border2);font-size:14px;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .2s ease}
  .toast.ok{border-color:var(--lime)} .toast.err{border-color:var(--danger)}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .loginBox{max-width:480px;margin:48px auto}
  .center{max-width:640px;margin:0 auto}
  a.navlnk{cursor:pointer}
  .demo-hint{display:none!important}
</style>
</head>
<body>
<div class="scr" style="min-height:100vh;display:flex;flex-direction:column;">
  <div id="topbar"></div>
  <div id="view" style="flex:1;padding-bottom:48px;"></div>
  <div class="foot">© 2026 Фитнес-клуб «ПУЛЬС»</div>
</div>
<div id="modal"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ============ УТИЛИТЫ ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DAYN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtD=d=>DAYN[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];
const fmtS=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
const fmtHM=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}
function sessStart(s){const [y,m,d]=s.date.split('-').map(Number);const [hh,mm]=s.time.split(':').map(Number);return new Date(y,m-1,d,hh,mm);}
function sessEnd(s){const t=sessStart(s);return new Date(t.getTime()+(s.dur||60)*60000);}

/* ============ ДАННЫЕ ============ */
const TARIFFS_DEF=[
 {id:'raz',name:'Разовый',price:990,days:1,visits:1,hot:false,feats:['Все виды занятий (1 день)','Все зоны клуба']},
 {id:'base',name:'Базовый',price:2990,days:30,visits:12,hot:true,feats:['12 посещений в месяц','Все виды занятий','Заморозка 7 дней']},
 {id:'unlim',name:'Безлимит',price:5990,days:30,visits:999,hot:false,feats:['Безлимит посещений','Все виды занятий','Заморозка 14 дней']}
];
const TRAINERS_DEF=[
 {id:'tr1',name:'Иванов Д.',spec:'HIIT, силовая'},
 {id:'tr2',name:'Соколова А.',spec:'Йога, стретчинг'},
 {id:'tr3',name:'Орлова М.',spec:'Пилатес'},
 {id:'tr4',name:'Ким С.',spec:'Сайклинг'}
];
const DIRS=['Йога','HIIT','Пилатес','Сайклинг','Стретчинг','Силовая'];
const GRAD={'Йога':'g-Yoga','HIIT':'g-HIIT','Пилатес':'g-Pilates','Сайклинг':'g-Cycling','Стретчинг':'g-Stretch','Силовая':'g-Str'};
const EMOJI={'Йога':'🧘','HIIT':'⚡','Пилатес':'🤸','Сайклинг':'🚴','Стретчинг':'🤸‍♀️','Силовая':'🏋️'};
// недельный шаблон расписания: [направление, время, зал, тренерIdx, вместимость]
const TMPL={
 1:[['Йога','18:00','Зал 2',1,20],['HIIT','18:30','Зал 2',0,20],['Пилатес','19:00','Зал 3',2,20],['Силовая','17:30','Зал 4',0,20]],
 2:[['Йога','10:00','Зал 2',1,20],['Сайклинг','19:00','Зал 1',3,20],['HIIT','20:00','Зал 2',0,20]],
 3:[['Йога','18:00','Зал 2',1,20],['HIIT','18:30','Зал 2',0,20],['Пилатес','19:00','Зал 3',2,20]],
 4:[['Стретчинг','19:00','Зал 3',1,20],['Сайклинг','18:00','Зал 1',3,20],['Силовая','20:00','Зал 4',0,20]],
 5:[['Силовая','17:30','Зал 4',0,20],['Йога','18:00','Зал 2',1,20],['HIIT','18:30','Зал 2',0,20],['Пилатес','19:00','Зал 3',2,20],['Сайклинг','19:00','Зал 1',3,20],['Стретчинг','20:00','Зал 3',1,20]],
 6:[['Йога','11:00','Зал 2',1,20],['HIIT','12:00','Зал 2',0,20],['Сайклинг','13:00','Зал 1',3,20]],
 0:[['Пилатес','11:00','Зал 3',2,20],['Сайклинг','12:00','Зал 1',3,20],['Стретчинг','13:00','Зал 3',1,20]]
};
function seedDB(){
  const today=new Date(); today.setHours(0,0,0,0);
  const db={users:[],subs:[],sessions:[],bookings:[],att:{},history:[],payments:[],seq:{u:0,s:0,b:0,p:0,t:0}};
  const nid=(k,p)=>p+(++db.seq[k]);
  // пользователи (FR-02: уникальный email)
  const client={id:nid('u','u'),name:'Алия Умарова',email:'client@puls.ru',pass:'demo',role:'client',initials:'АУ',trainerId:null};
  const trainer={id:nid('u','u'),name:'Дмитрий Иванов',email:'trainer@puls.ru',pass:'demo',role:'trainer',initials:'ДИ',trainerId:'tr1'};
  const admin={id:nid('u','u'),name:'Администратор',email:'admin@puls.ru',pass:'demo',role:'admin',initials:'АД',trainerId:null};
  db.users=[client,trainer,admin];
  // расписание на 7 дней от сегодня
  for(let i=0;i<7;i++){
    const d=new Date(today); d.setDate(today.getDate()+i);
    (TMPL[d.getDay()]||[]).forEach(t=>{
      db.sessions.push({id:nid('s','s'),name:t[0],dir:t[0],date:dkey(d),time:t[1],dur:60,hall:t[2],trainerId:TRAINERS_DEF[t[3]].id,cap:t[4]});
    });
  }
  // демо-занятия «сегодня» для проверки правил (UC-03: 2 часа)
  const s1=new Date(Date.now()+1*3600000), s3=new Date(Date.now()+3*3600000);
  db.sessions.push({id:nid('s','s'),name:'Стретчинг',dir:'Стретчинг',date:dkey(s1),time:pad(s1.getHours())+':'+pad(s1.getMinutes()),dur:60,hall:'Зал 3',trainerId:'tr2',cap:20});
  db.sessions.push({id:nid('s','s'),name:'Сайклинг',dir:'Сайклинг',date:dkey(s3),time:pad(s3.getHours())+':'+pad(s3.getMinutes()),dur:60,hall:'Зал 1',trainerId:'tr4',cap:20});
  const soon=db.sessions[db.sessions.length-2], later=db.sessions[db.sessions.length-1];
  // абонемент клиента (US-02): активен, 10 из 12
  const st=new Date(today); st.setDate(today.getDate()-20);
  const en=new Date(today); en.setDate(today.getDate()+10);
  db.subs.push({id:nid('t','t'),userId:client.id,tariffId:'base',start:dkey(st),end:dkey(en),visitsLeft:10,visitsTotal:12});
  // записи клиента (US-04): на «сегодня +3ч» и на завтра
  const tomorrow=new Date(today); tomorrow.setDate(today.getDate()+1);
  const tomSess=db.sessions.find(s=>s.date===dkey(tomorrow));
  db.bookings.push({id:nid('b','b'),sessId:later.id,userId:client.id,created:Date.now()-86400000,status:'active'});
  if(tomSess) db.bookings.push({id:nid('b','b'),sessId:tomSess.id,userId:client.id,created:Date.now()-86400000,status:'active'});
  // история посещений (US-06, FR-06): прошедшие занятия
  [[-3,'present'],[-5,'present'],[-8,'absent'],[-10,'present']].forEach(([off,st2],ix)=>{
    const d=new Date(today); d.setDate(today.getDate()+off);
    db.history.push({userId:client.id,date:dkey(d),time:'18:30',name:ix%2?'HIIT':'Йога',trainer:'Соколова А.',status:st2});
  });
  // платёж (US-02, A-01 выручка)
  db.payments.push({id:nid('p','p'),userId:client.id,tariffId:'base',amount:2990,status:'paid',date:dkey(st)});
  return db;
}
let DB=null;
try{ DB=JSON.parse(localStorage.getItem('puls_db')); }catch(e){}
if(!DB||!DB.users){ DB=seedDB(); save(); }
function save(){ localStorage.setItem('puls_db',JSON.stringify(DB)); }
function resetDB(){ DB=seedDB(); save(); location.hash='#/home'; route(); toast('Демо-данные сброшены','ok'); }

/* ============ СЕССИЯ ============ */
let USER=null;
try{ USER=JSON.parse(localStorage.getItem('puls_user')); }catch(e){}
function setUser(u){ USER=u; localStorage.setItem('puls_user',JSON.stringify(u)); }
function getSub(uid){ const s=DB.subs.find(x=>x.userId===uid&&x.status!=='cancelled'); if(!s)return null; const end=new Date(s.end+'T23:59:59'); s.status=(end>=new Date()&&s.visitsLeft>0)?'active':'expired'; return s; }
function getTariff(id){ return TARIFFS_DEF.find(t=>t.id===id)||DB.tariffsCustom?.find(t=>t.id===id); }
function trainerName(id){ const t=TRAINERS_DEF.find(x=>x.id===id); return t?t.name:'—'; }
function activeBookings(sid){ return DB.bookings.filter(b=>b.sessId===sid&&b.status==='active'); }

/* ============ БИЗНЕС-ПРАВИЛА ============ */
function canBook(sess){
  if(!USER||USER.role!=='client') return {ok:false,msg:'Войдите как клиент, чтобы записаться на занятие'};
  const sub=getSub(USER.id);
  if(!sub||sub.status!=='active') return {ok:false,msg:'Нет активного абонемента — оформите тариф (UC-01)'};
  if(sub.visitsLeft<1) return {ok:false,msg:'Посещения абонемента исчерпаны — продлите тариф'};
  if(activeBookings(sess.id).some(b=>b.userId===USER.id)) return {ok:false,msg:'Вы уже записаны на это занятие (BR-01)'};
  if(activeBookings(sess.id).length>=sess.cap) return {ok:false,msg:'Свободных мест нет — запись закрыта (BR-01)'};
  return {ok:true};
}
function cancelCheck(sess){
  const diff=(sessStart(sess)-Date.now())/3600000;
  if(diff<=0) return {ok:false,msg:'Занятие уже началось — отмена недоступна'};
  if(diff<2) return {ok:false,msg:'До начала занятия менее 2 часов — отмена недоступна (правило клуба · UC-03)'};
  return {ok:true};
}

/* ============ ТОПБАР ============ */
function renderTopbar(){
  let nav='',right='';
  if(!USER){
    nav=`<a data-go="#/home" class="navlnk ${route0()==='home'?'on':''}">Главная</a>
         <a data-go="#/tariffs" class="navlnk ${route0()==='tariffs'?'on':''}">Тарифы</a>
         <a data-go="#/schedule" class="navlnk ${route0()==='schedule'||route0()==='session'?'on':''}">Расписание</a>`;
    right=`<div class="btn btn-m btn-primary" data-go="#/login">Войти</div>`;
  }else if(USER.role==='client'){
    nav=`<a data-go="#/home" class="navlnk ${route0()==='home'?'on':''}">Главная</a>
         <a data-go="#/tariffs" class="navlnk ${route0()==='tariffs'?'on':''}">Тарифы</a>
         <a data-go="#/schedule" class="navlnk ${route0()==='schedule'||route0()==='session'?'on':''}">Расписание</a>
         <a data-go="#/bookings" class="navlnk ${route0()==='bookings'?'on':''}">Мои записи</a>`;
    right=`<div class="badge badge-green">Клиент · ${esc(USER.name.split(' ')[0])}</div><div class="avatar" data-go="#/cabinet" style="cursor:pointer">${esc(USER.initials)}</div>`;
  }else if(USER.role==='trainer'){
    nav=`<a data-go="#/t1" class="navlnk ${route0().startsWith('t')?'on':''}">Мои занятия</a>`;
    right=`<div class="badge badge-info">Тренер · ${esc(USER.name.split(' ')[0])}</div><div class="avatar" data-go="#/t1" style="cursor:pointer">${esc(USER.initials)}</div>`;
  }else{
    nav=`<a data-go="#/a1" class="navlnk ${route0()==='a1'?'on':''}">Обзор</a>
         <a data-go="#/a2" class="navlnk ${route0()==='a2'?'on':''}">Расписание</a>
         <a data-go="#/a3" class="navlnk ${route0()==='a3'?'on':''}">Тарифы</a>`;
    right=`<div class="badge badge-warn">Администратор</div><div class="avatar" data-go="#/a1" style="cursor:pointer">${esc(USER.initials)}</div>`;
  }
  $('#topbar').innerHTML=`<div class="topbar">
    <div class="logo" data-go="#/home" style="cursor:pointer"><div class="dot"></div><div class="h3">ПУЛЬС</div></div>
    <nav class="nav">${nav}</nav><div class="sp"></div>${right}</div>`;
}
function route0(){ return (location.hash||'#/home').slice(2).split('/')[0]; }

/* ============ РОУТЕР ============ */
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){ e.preventDefault(); location.hash=g.getAttribute('data-go'); return; }
  const a=e.target.closest('[data-act]');
  if(a){ ACT[a.getAttribute('data-act')](a); }
});
function route(){
  renderTopbar(); closeModal();
  const h=(location.hash||'#/home').slice(2);
  const p=h.split('/');
  const views={
    'home':vHome,'tariffs':vTariffs,'schedule':vSchedule,'session':vSession,
    'login':vLogin,'register':vRegister,'pay':vPay,'payres':vPayRes,
    'cabinet':vCabinet,'bookings':vBookings,'cancel':vCancel,'history':vHistory,
    'booked':vBooked,'t1':vT1,'t2':vT2,'t3':vT3,'a1':vA1,'a2':vA2,'a3':vA3
  };
  const roleGuard={cabinet:'client',bookings:'client',cancel:'client',history:'client',pay:'client',payres:'client',booked:'client',t1:'trainer',t2:'trainer',t3:'trainer',a1:'admin',a2:'admin',a3:'admin'};
  const need=roleGuard[p[0]];
  if(need&&(!USER||USER.role!==need)){ toast('Требуется вход: '+({client:'клиент',trainer:'тренер',admin:'администратор'}[need]),'err'); setUser(null); location.hash='#/login'; return; }
  const fn=views[p[0]]||v404;
  $('#view').innerHTML=fn(p[1]);
  if(p[0]==='schedule') renderScheduleGrid();
  window.scrollTo(0,0);
}

/* ============ ОБЩИЕ БЛОКИ ============ */
function chip(code){ return ''; }
function phBlock(dir,big){ return `<div class="ph2 ${GRAD[dir]||'g-Yoga'}" ${big?'style="height:260px;border-radius:20px"':''}><div class="em">${EMOJI[dir]||'🏋️'}</div><div class="nm">${esc(dir)}</div></div>`; }
function seatsBar(sess){
  const left=sess.cap-activeBookings(sess.id).length, pct=Math.min(100,Math.round(activeBookings(sess.id).length/sess.cap*100));
  const full=left<1;
  return `<div class="prog"><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="bs ${full?'t-danger':'t2'}">${full?'Мест нет':('Осталось '+left+' из '+sess.cap+' мест')}</div></div>`;
}
function subCard(){
  const sub=getSub(USER.id);
  if(!sub) return `<div class="panel"><div class="h3">Абонемент</div><div class="bs t2">Активного абонемента нет.</div><div class="btn btn-m btn-primary" data-go="#/tariffs">Выбрать тариф</div></div>`;
  const t=getTariff(sub.tariffId)||{name:'Тариф'};
  const pct=Math.round(sub.visitsLeft/sub.visitsTotal*100);
  const daysLeft=Math.max(0,Math.round((new Date(sub.end+'T23:59:59')-new Date())/86400000));
  return `<div class="panel"><div style="display:flex;align-items:center;gap:12px;"><div class="h3" style="flex:1">Абонемент · ${esc(t.name)}</div><div class="badge ${sub.status==='active'?'badge-green':'badge-danger'}">${sub.status==='active'?'Активен':'Истёк'}</div></div>
    <div class="krow"><span class="bs t2">Посещения</span><span class="bs-med">${sub.visitsLeft>=999?'∞':sub.visitsLeft} из ${sub.visitsTotal>=999?'∞':sub.visitsTotal}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="krow"><span class="bs t2">Действует до</span><span class="bs-med">${sub.end}</span></div>
    <div class="krow"><span class="bs t2">Осталось дней</span><span class="bs-med">${daysLeft}</span></div></div>`;
}
function banner(kind,tt,sb){ return `<div class="banner banner-${kind}"><div class="ic">${kind==='ok'?'✓':kind==='err'?'✕':'!'}</div><div class="col"><div class="tt">${tt}</div>${sb?`<div class="sb">${sb}</div>`:''}</div></div>`; }
function modal(html){ $('#modal').innerHTML=`<div class="dlgWrap" data-act="closeModal">${html}</div>`; }
function closeModal(){ $('#modal').innerHTML=''; }

/* ============ ЭКРАН: ГЛАВНАЯ (US-01) ============ */
function vHome(){
  const stats=DB.sessions.filter(s=>s.date===dkey(new Date())).length;
  return `
  <div class="hero" style="display:flex;gap:60px;padding:64px 40px;align-items:center;">
    <div style="display:flex;flex-direction:column;gap:22px;max-width:600px;">
      ${chip('US-01 · FR-01 · Гость → клиент')}
      <div class="disp" style="font-size:52px;line-height:58px;">Сила начинается здесь</div>
      <div class="bl t2">Расписание, абонементы и записи — в единой системе клуба «ПУЛЬС». Выбирайте тариф и записывайтесь на занятия онлайн.</div>
      <div style="display:flex;gap:14px;">
        <div class="btn btn-l btn-primary" data-go="#/tariffs">Выбрать тариф</div>
        <div class="btn btn-l btn-secondary" data-go="#/schedule">Смотреть расписание</div>
      </div>
      <div style="display:flex;gap:16px;">
        <div class="stat" style="width:190px"><div class="l">Занятий сегодня</div><div class="v">${stats}</div><div class="d">в залах клуба</div></div>
        <div class="stat" style="width:190px"><div class="l">Направлений</div><div class="v">${DIRS.length}</div><div class="d">йога · HIIT · сайклинг…</div></div>
        <div class="stat" style="width:190px"><div class="l">Тренеров</div><div class="v">${TRAINERS_DEF.length}</div><div class="d">у каждого специализация</div></div>

function paySubmit(e,tariffId){
  e.preventDefault();
  const num=$('#cardnum').value.replace(/\D/g,'');
  if(num.length<12){ toast('Введите номер карты','err'); return false; }
  const t=getTariff(tariffId);
  const status=num.startsWith('9')?'pending':num.startsWith('0')?'declined':'paid';
  const p={id:'p'+(++DB.seq.p),userId:USER.id,tariffId,amount:t.price,status,date:dkey(new Date())};
  DB.payments.push(p);
  if(status==='paid') applySub(USER.id,t);
  save();
  location.hash='#/payres/'+p.id;
  return false;
}
function applySub(uid,t){
  const old=DB.subs.find(x=>x.userId===uid);
  if(old){ old.tariffId=t.id; old.visitsTotal=t.visits; old.visitsLeft=t.visits; old.start=dkey(new Date());
    const e=new Date(); e.setDate(e.getDate()+t.days); old.end=dkey(e); old.status='active'; }
  else{ const e=new Date(); e.setDate(e.getDate()+t.days);
    DB.subs.push({id:'t'+(++DB.seq.t),userId:uid,tariffId:t.id,start:dkey(new Date()),end:dkey(e),visitsLeft:t.visits,visitsTotal:t.visits}); }
}

}

      <div class="h3">Добавить тариф</div>
      <form onsubmit="return addTariff(event)" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div class="field"><label>Название</label><input class="input" id="a3name" placeholder="Студенческий" style="width:180px" required></div>
        <div class="field"><label>Цена, ₽</label><input class="input" id="a3price" type="number" value="1990" style="width:110px" required></div>
        <div class="field"><label>Дней</label><input class="input" id="a3days" type="number" value="30" style="width:90px" required></div>
        <div class="field"><label>Посещений (∞ = 999)</label><input class="input" id="a3visits" type="number" value="8" style="width:110px" required></div>
        <button class="btn btn-m btn-primary" type="submit">Опубликовать</button>
      </form>
    </div>
    <div class="tbl wrap"><table class="tbl"><tr><th>Тариф</th><th>Цена</th><th>Период</th><th>Посещений</th><th></th></tr>
    ${ts.map(t=>`<tr><td>${esc(t.name)} ${t.hot?'<span class="badge badge-solid" style="margin-left:8px">хит</span>':''}</td>
      <td>${t.price} ₽</td><td>${t.days} дн.</td><td>${t.visits>=999?'∞':t.visits}</td>
      <td>${TARIFFS_DEF.some(d=>d.id===t.id)?'<span class="cap t3">базовый</span>':`<span class="t-danger" style="cursor:pointer" data-act="delTariff" data-id="${t.id}">снять с публикации</span>`}</td></tr>`).join('')}
    </table></div></div>`;
}
function addTariff(e){
  e.preventDefault();
  const t={id:'tar'+Date.now(),name:$('#a3name').value.trim(),price:+$('#a3price').value,days:+$('#a3days').value,visits:+$('#a3visits').value,hot:false,feats:['Доступ в клуб','Все виды занятий']};
  DB.tariffsCustom=DB.tariffsCustom||[]; DB.tariffsCustom.push(t); save();
  toast('Тариф опубликован в каталоге (FR-03)','ok'); route(); return false;
}
function delTariff(id){ DB.tariffsCustom=(DB.tariffsCustom||[]).filter(t=>t.id!==id); save(); toast('Тариф снят с публикации'); route(); }

/* ============ 404 ============ */
function v404(){ return `<div class="center" style="padding:80px 40px;text-align:center">
  <div class="disp2">404</div><div class="bl t2">Страница не найдена</div>
  <div class="btn btn-m btn-primary" style="margin:20px auto 0" data-go="#/home">На главную</div></div>`; }

/* ============ СТАРТ ============ */
route();
</script>
</body>
</html>
